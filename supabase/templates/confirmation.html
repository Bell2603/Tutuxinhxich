<!doctype html>
<html lang="vi">
  <body
    style="
      margin: 0;
      background: #fff8f1;
      font-family: Helvetica, Arial, sans-serif;
      color: #2b1145;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            style="max-width: 520px; background: #ffffff; border-radius: 28px; padding: 32px"
          >
            <tr>
              <td>
                <p
                  style="
                    margin: 0;
                    font-size: 12px;
                    letter-spacing: 4px;
                    font-weight: 700;
                    color: #d4145a;
                  "
                >
                  TU TU XÌNH XỊCH
                </p>
                <h1 style="margin: 12px 0 8px; font-size: 26px">Chào mừng lên tàu! 🧣</h1>
                <p style="margin: 0 0 20px; line-height: 1.6; color: #5b4a6e">
                  Cảm ơn bạn đã đăng ký tài khoản <strong>{{ .Email }}</strong>. Bấm nút bên dưới để
                  xác nhận email và bắt đầu mua sắm.
                </p>
                <p style="margin: 0 0 24px">
                  <a
                    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/tai-khoan"
                    style="
                      display: inline-block;
                      background: #ff4f9a;
                      color: #2b1145;
                      text-decoration: none;
                      font-weight: 700;
                      padding: 14px 28px;
                      border-radius: 999px;
                    "
                    >Xác nhận email</a
                  >
                </p>
                <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #74668a">
                  Nếu bạn không đăng ký, hãy bỏ qua email này.
                </p>
              </td>
            </tr>
          </table>
          <p style="margin: 16px 0 0; font-size: 12px; color: #74668a">
            Xinh từng nút thắt, chất từng chuyến đi.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
